[project]
name = "esphome-m5stack-atom-barcode-scanner"
version = "0.1.0"
description = "ESPHome external component for the M5Stack Atom QR Code Scanner"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "esphome==2026.7.2",
    "fatfs-ng>=0.1.15",
    "littlefs-python>=0.17.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "ruff>=0.15.15",
    "yamllint>=1.38.0",
]

[tool.uv]
# CI installs the newest uv satisfying this (astral-sh/setup-uv reads it).
required-version = ">=0.8"

[tool.pytest.ini_options]
markers = [
    "integration: host-platform firmware tests (compile ESPHome; run with -m integration)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstring style conflicts — pick D211/D213 variants
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    # Conflicts with the formatter (ruff's documented recommendation)
    "COM812",
    # subprocess with a fixed list is not untrusted input (test runner only)
    "S603",
    # No copyright headers in this project
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# Any is used extensively in ESPHome codegen helpers
"components/m5stack_barcode/__init__.py" = ["ANN401"]
"tests/**" = ["S101"]  # assert is how pytest checks
