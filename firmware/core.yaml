# Shared scanner configuration — included by all device firmwares via packages.
#
# Everything here is device-agnostic: network stack, scanner component config,
# HA entities, and text sensors.  Hardware-specific items (GPIO pins, LED strip,
# physical buttons) live in the per-device file (e.g. atom_lite.yaml).
#
# Depends on the including file providing:
#   - uart_bus  (uart component id for the scanner serial connection)

external_components:
  # Local builds use this checkout; firmware.yaml (the entry point for remote packages and
  # dashboard adoption) sets component_source to the GitHub repository instead.
  - source: ${component_source | default("../components")}
    components: [m5stack_barcode]

logger:
  level: DEBUG

# ── Security and onboarding ──────────────────────────────────────────────────
# This firmware is published, so it contains no credentials: anything baked into a
# public binary can be extracted by anyone who downloads it.
#
# - API: encrypted, with a key unique to each device. Home Assistant (or the ESPHome
#   dashboard) sets it when the device is adopted; it is stored in flash and only a
#   factory reset of the ESP removes it. Until then only the adopting client can set it.
# - OTA: once the key is set, ESPHome uploads are authenticated and encrypted with it.
# - provisioning: an unprovisioned device only accepts Wi-Fi setup and adoption during a
#   window after power-up (EN 18031). If it closes, power-cycle the device to reopen it.
# - Wi-Fi setup: over USB with Improv Serial right after flashing (web.esphome.io), or
#   via the fallback access point and captive portal.
api:
  encryption: {}

ota:
  - platform: esphome
  - platform: http_request

provisioning:
  timeout: 15min

http_request:
  # GitHub release downloads redirect to a CDN with a long signed URL. The HTTP
  # request line for the redirect (GET /path?query HTTP/1.1) is ~891 bytes;
  # buffer_size_tx must exceed this. 1024 provides comfortable headroom.
  buffer_size_rx: 512
  buffer_size_tx: 1024

wifi:
  ap:

captive_portal:

improv_serial:

m5stack_barcode:
  id: barcode_scanner
  operation_mode: host
  terminator: none
  buzzer_volume: medium
  uart_id: uart_bus

  barcode_sensor:
    name: "Last Barcode"
    icon: "mdi:barcode"

  version_sensor:
    name: "Scanner Version"
    entity_category: "diagnostic"
    icon: "mdi:information-outline"

  factory_reset_button:
    name: "Factory Reset Scanner"
    entity_category: "diagnostic"
    icon: "mdi:restore"
    disabled_by_default: true

  scan_event:
    name: "Barcode Scanned"
    icon: "mdi:barcode-scan"

  on_barcode:
    - homeassistant.event:
        event: esphome.barcode_scanned
        data:
          barcode: !lambda return x;

  light_mode_select:
    name: "Light Mode"
    entity_category: "config"
    icon: "mdi:lightbulb"

  locate_light_mode_select:
    name: "Locate Light Mode"
    entity_category: "config"
    icon: "mdi:crosshairs"

  scan_duration_select:
    name: "Scan Duration"
    entity_category: "config"
    icon: "mdi:timer"

  buzzer_volume_select:
    name: "Volume"
    entity_category: "config"
    icon: "mdi:volume-medium"

  sound_switch:
    name: "Sound"
    entity_category: "config"
    icon: "mdi:volume-high"

  boot_sound_switch:
    name: "Boot Sound"
    entity_category: "config"
    icon: "mdi:power"

  decode_sound_switch:
    name: "Decode Sound"
    entity_category: "config"
    icon: "mdi:volume-source"

  decoding_success_light_switch:
    name: "Decoding Success Light"
    entity_category: "config"
    icon: "mdi:led-on"

  cmd_ack_sound_switch:
    name: "Command ACK Sound"
    entity_category: "config"
    icon: "mdi:bell-check"

  config_code_scan_switch:
    name: "Config Code Scanning"
    entity_category: "config"
    icon: "mdi:barcode-off"

  terminator_select:
    name: "Terminator"
    entity_category: "config"
    icon: "mdi:keyboard-return"

  stable_induction_time_select:
    name: "Stable Induction Time"
    entity_category: "config"
    icon: "mdi:timer-sand"

  reading_interval_select:
    name: "Reading Interval"
    entity_category: "config"
    icon: "mdi:timer-outline"

  same_code_interval_select:
    name: "Same Code Interval"
    entity_category: "config"
    icon: "mdi:timer-refresh"

button:
  - platform: restart
    name: "${friendly_name} Restart"
    entity_category: "diagnostic"
    icon: "mdi:restart"
