version: 2
updates:
  # Keep GitHub Actions pinned SHAs up to date (covers all workflows including pre-commit-autoupdate.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # One PR per week for all action bumps instead of one per action.
    groups:
      github-actions:
        patterns: ["*"]

  # Keep Python dependencies in pyproject.toml up to date.
  # The uv ecosystem updates pyproject.toml and uv.lock together.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
