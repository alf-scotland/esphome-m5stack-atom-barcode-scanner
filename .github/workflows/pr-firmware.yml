name: PR Firmware

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'firmware/**'
      - 'firmware.yaml'
      - 'components/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pr-firmware.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit SHA to build'
        required: true
        default: 'main'

permissions:
  contents: read
  pull-requests: write  # post the artifact link comment
  actions: read         # look up the uploaded artifact

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-pr-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        # No dev group: firmware builds only need esphome, not lint/format tools.
        run: uv sync --locked --no-dev

      - name: Set build name
        id: set_ref
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "ref_name=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            # Branch names may contain '/', which artifact names and versions cannot.
            echo "ref_name=${INPUT_REF//\//-}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the build name as the firmware version
        env:
          BUILD_NAME: ${{ steps.set_ref.outputs.ref_name }}
        run: |
          sed -i "s|project_version: \".*\"|project_version: \"$BUILD_NAME\"|" firmware/atom_lite.yaml

      - name: Cache ESPHome toolchains
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.esphome
            ~/.platformio
          key: esphome-esp32-${{ hashFiles('uv.lock') }}

      - name: Compile firmware
        run: uv run esphome compile firmware/atom_lite.yaml

      - name: Collect firmware files
        run: |
          mkdir -p firmware-files
          find firmware/.esphome -type f -name "*.bin" -exec cp {} firmware-files/ \;
          ls -la firmware-files/

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-firmware-${{ steps.set_ref.outputs.ref_name }}
          path: firmware-files/*.bin
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Comment with firmware download link
        # Fork PRs get a read-only token, so they cannot be commented on.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          ARTIFACT_NAME: pr-firmware-${{ steps.set_ref.outputs.ref_name }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;

            // Replace the previous build comment instead of accumulating them.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            });
            for (const comment of comments) {
              if (comment.user.login === 'github-actions[bot]' &&
                  comment.body.trim().startsWith('## Firmware Build')) {
                await github.rest.issues.deleteComment({owner, repo, comment_id: comment.id});
              }
            }

            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: context.runId,
            });
            const artifact = artifacts.find(a => a.name === process.env.ARTIFACT_NAME);
            const artifactUrl = artifact ? `${runUrl}/artifacts/${artifact.id}` : runUrl;

            const body = [
              '## Firmware Build',
              '',
              `Firmware for commit ${context.payload.pull_request.head.sha.slice(0, 7)} is ready for testing.`,
              '',
              `[📥 **Download firmware artifacts**](${artifactUrl})`,
              '',
              '- **firmware.factory.bin** — first-time flashing or complete reset (e.g. via https://web.esphome.io/)',
              '- **firmware.ota.bin** — OTA update from the ESPHome dashboard or CLI',
            ].join('\n');
            await github.rest.issues.createComment({owner, repo, issue_number, body});
