name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-rc.*'

# Releases push the OTA manifest to main; never run two at once or cancel one midway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release, push the OTA manifest
      id-token: write      # sign the build provenance attestation
      attestations: write  # store it
    steps:
      - name: Checkout code
        # Credentials stay persisted: the last step pushes the OTA manifest to main.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1  # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0  # the tagged commit is checked against main's history

      - name: Install uv
        # No dependency cache here: release binaries must not be built from a cache
        # that another (e.g. pull request) workflow could have populated.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: false

      - name: Install dependencies
        # No dev group: release builds only need esphome, not lint/format tools.
        run: uv sync --locked --no-dev

      - name: Extract and validate version from tag
        id: extract_version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}

          # Validate tag matches CalVer YYYY.MM.PATCH with optional pre-release suffix
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]]; then
            echo "ERROR: Tag 'v$TAG' does not match expected format vYYYY.MM.PATCH or vYYYY.MM.PATCH-(beta|rc).N"
            exit 1
          fi

          echo "version=$TAG" >> $GITHUB_OUTPUT

          if [[ "$TAG" == *-beta.* || "$TAG" == *-rc.* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify the release commit is on main
        # Stable releases become the OTA update of every device, so they must be built from
        # reviewed code on main (pre-releases may come from release branches).
        if: steps.extract_version.outputs.is_prerelease == 'false'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - name: Verify firmware version matches tag
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          YAML_VERSION=$(grep 'project_version:' firmware/atom_lite.yaml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$YAML_VERSION" != "$VERSION" ]; then
            echo "ERROR: tag v$VERSION does not match project_version '$YAML_VERSION' in firmware/atom_lite.yaml"
            echo "Update project_version in firmware/atom_lite.yaml to '$VERSION' and commit before tagging."
            exit 1
          fi
          echo "Version verified: $VERSION"

      - name: Build firmware
        run: uv run esphome compile firmware/atom_lite.yaml

      - name: Copy firmware binaries to release directory
        run: |
          mkdir -p release-files
          find firmware/.esphome -type f \( -name "firmware.ota.bin" -o -name "firmware.factory.bin" \) -exec cp -v {} release-files/ \;
          if [ -z "$(ls -A release-files/)" ]; then
            echo "ERROR: No firmware binaries found after build"
            exit 1
          fi
          echo "Release files:"
          ls -lh release-files/

      - name: Attest build provenance
        # Lets anyone verify a binary was built by this workflow from this repository:
        #   gh attestation verify firmware.ota.bin --repo alf-scotland/esphome-m5stack-atom-barcode-scanner
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release-files/*.bin

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.extract_version.outputs.version }}
          IS_PRERELEASE: ${{ steps.extract_version.outputs.is_prerelease }}
        run: |
          flags=()
          [ "$IS_PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "v$VERSION" release-files/*.bin \
            --title "Release v$VERSION" --generate-notes --verify-tag "${flags[@]}"

      - name: Generate OTA manifest
        # Skip manifest update for pre-releases — only stable versions are offered as OTA.
        if: steps.extract_version.outputs.is_prerelease == 'false'
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OTA_BIN="release-files/firmware.ota.bin"
          MD5=$(md5sum "$OTA_BIN" | cut -d' ' -f1)
          OTA_URL="https://github.com/alf-scotland/esphome-m5stack-atom-barcode-scanner/releases/download/v${VERSION}/firmware.ota.bin"
          RELEASE_URL="https://github.com/alf-scotland/esphome-m5stack-atom-barcode-scanner/releases/tag/v${VERSION}"

          # The release notes GitHub generated; exported so the Python heredoc can read them.
          export RELEASE_SUMMARY=$(gh release view "v${VERSION}" --json body --jq '.body')

          # Written outside the checkout; the next step commits it on top of main.
          # Use Python for safe JSON serialisation — release body contains newlines and quotes.
          python3 - "$VERSION" "$OTA_URL" "$MD5" "$RELEASE_URL" "$RUNNER_TEMP/atom_lite.json" <<'PYEOF'
          import json, sys, os
          version, ota_url, md5, release_url, path = sys.argv[1:6]
          manifest = {
              "name": "atom-barcode",
              "version": version,
              "builds": [{
                  "chipFamily": "ESP32",
                  "ota": {
                      "path": ota_url,
                      "md5": md5,
                      "summary": os.environ.get("RELEASE_SUMMARY", ""),
                      "release_url": release_url,
                  },
              }],
          }
          with open(path, "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PYEOF

          echo "Generated manifest:"
          cat "$RUNNER_TEMP/atom_lite.json"

      - name: Commit manifest to main
        if: steps.extract_version.outputs.is_prerelease == 'false'
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/atom_lite.json" manifests/atom_lite.json
          git add manifests/atom_lite.json
          git commit -m "chore: update OTA manifest for v${VERSION} [skip ci]"
          # main may have moved while the firmware was building.
          for attempt in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
