# Entry point for remote use of the reference firmware: ESPHome dashboard adoption
# (dashboard_import in firmware/atom_lite.yaml) and configs that package it via github://.
#
# A remote package cannot use the local ../components path (external_components paths
# resolve relative to the top-level config), so this file loads the component from GitHub.
substitutions:
  component_source: github://alf-scotland/esphome-m5stack-atom-barcode-scanner@main

packages:
  device: !include firmware/atom_lite.yaml
